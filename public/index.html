<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão Escolar</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 540px;
      width: 90%;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.8rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.5rem;
      display: none;
      text-align: left;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .success {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    .error {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sistema de Gestão Escolar</h1>
    <p>Estrutura de tabelas e relacionamentos configurada com sucesso para implantação no <strong>Vercel Postgres</strong>.</p>
    
    <button id="btnMigrate" onclick="executarMigracao()">Criar Tabelas no Banco</button>
    <div id="result"></div>
  </div>

  <script>
    async function executarMigracao() {
      const btn = document.getElementById('btnMigrate');
      const resDiv = document.getElementById('result');
      btn.disabled = true;
      btn.innerText = 'Processando tabelas...';
      resDiv.style.display = 'none';

      try {
        const response = await fetch('/api/migrate');
        const data = await response.json();

        resDiv.style.display = 'block';
        if (data.success) {
          resDiv.className = 'success';
          resDiv.innerText = '✓ ' + data.message;
        } else {
          resDiv.className = 'error';
          resDiv.innerText = '✗ Erro: ' + (data.error || 'Falha ao executar migração.');
        }
      } catch (err) {
        resDiv.style.display = 'block';
        resDiv.className = 'error';
        resDiv.innerText = '✗ Falha na requisição: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Criar Tabelas no Banco';
      }
    }
  </script>
</body>
</html>
